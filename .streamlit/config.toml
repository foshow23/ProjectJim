# How the app looks: iOS system colors, always light (white), whatever the device's setting.

[client]
toolbarMode = "minimal"         # no Deploy button or developer menu

[browser]
gatherUsageStats = false

[server]
runOnSave = true                # code edits show up right away, without pressing Rerun
address = "localhost"           # only this computer can open the app; see the README to use it on your phone

[theme]
base = "light"                          # always light; jim/ios.py follows this
primaryColor = "#007AFF"
backgroundColor = "#F2F2F7"             # iOS grouped background
secondaryBackgroundColor = "#E9E9EE"    # text fields and segmented controls
textColor = "#000000"
borderColor = "#D1D1D6"
font = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif"
baseRadius = "0.75rem"
showWidgetBorder = false
